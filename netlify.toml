# Netlify: cada vez que cambia algo en GitHub (por ejemplo, cuando publicas una guía en /admin) se vuelve a generar el blog.
[build]
  command = "node tools/build-blog.js"
  publish = "."

# Archivos internos que no deben servirse en el sitio (borradores incluidos).
[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# El backoffice no debe aparecer en Google.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
